<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';"><title>Mini App 管理中心</title><style>
:root{font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:#20232a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:58px 1fr;overflow:hidden}header{background:#1e2735;color:#fff;display:flex;align-items:center;padding:0 22px;gap:18px}h1{font-size:18px;margin:0;font-weight:600}.tabs{display:flex;gap:4px;margin-left:auto}.tab{border:0;background:transparent;color:#c9d3e0;padding:8px 12px;border-radius:4px;cursor:pointer}.tab.active,.tab:hover{background:#334357;color:#fff}main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}main.settings-mode{grid-template-columns:minmax(0,1fr)}main.settings-mode .content{padding:34px 48px}.sidebar{background:#fff;border-right:1px solid #dce1e8;display:flex;flex-direction:column;min-height:0}.search{margin:14px;padding:9px 11px;border:1px solid #cfd5de;border-radius:4px;font:inherit}.list{overflow:auto;flex:1;padding:0 8px 12px}.app{padding:11px 12px;margin:3px 0;border-radius:4px;cursor:pointer;border:1px solid transparent}.app:hover{background:#f0f4f8}.app.selected{background:#e7f0fc;border-color:#b9d1f1}.app-title{display:flex;justify-content:space-between;gap:8px;font-weight:600}.app-meta{color:#6b7480;font-size:12px;margin-top:3px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9ba5b1;margin-right:6px}.dot.running{background:#2e9b68}.dot.crashed,.dot.broken{background:#d9534f}.content{padding:26px 32px;overflow:auto;min-width:0}.panel{max-width:850px}.settings{max-width:760px;width:100%}.settings .card{max-width:760px}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #dce1e8;padding-bottom:18px;margin-bottom:20px}.title{margin:0 0 4px;font-size:24px}.muted{color:#687381}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{font:inherit;border:1px solid #bfc8d3;background:#fff;color:#27313d;border-radius:4px;padding:7px 11px;cursor:pointer}button:hover{background:#edf2f7}button.primary{background:#2f6fdb;color:#fff;border-color:#2f6fdb}button.danger{color:#a52b2b}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #dce1e8;border-radius:6px;padding:16px}.card h2{font-size:15px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:20px;margin:8px 0}.label{color:#687381}.code{font-family:Consolas,monospace;word-break:break-all}.permission{display:inline-block;padding:3px 7px;margin:3px;border:1px solid #cfd5de;border-radius:3px;font-size:12px}.permission.unknown{color:#a52b2b;border-color:#e0aaaa}.state{padding:48px 12px;text-align:center;color:#687381}.error{color:#a52b2b;background:#fff1f1;border:1px solid #efc4c4;border-radius:4px;padding:12px;margin:12px 0}.notice{position:fixed;right:22px;bottom:18px;background:#263442;color:#fff;padding:10px 14px;border-radius:4px;display:none}.notice.show{display:block}.logbox{background:#18202a;color:#d6e0eb;padding:14px;border-radius:5px;white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto;font:12px/1.6 Consolas,monospace}.settings{max-width:620px}.field{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid #e1e5ea}.field input{padding:8px;border:1px solid #cfd5de;border-radius:4px;font:inherit}.empty{padding:34px;color:#687381;text-align:center}.hidden{display:none!important}@media(max-width:800px){main{grid-template-columns:240px 1fr}main.settings-mode{grid-template-columns:minmax(0,1fr)}main.settings-mode .content{padding:24px}.content{padding:20px}.cards{grid-template-columns:1fr}}
</style></head><body><header><h1>Mini App 管理中心</h1><nav class="tabs"><button class="tab active" data-view="apps">App</button><button class="tab" data-view="settings">Host 设置</button></nav></header><main id="main-layout"><aside class="sidebar" id="sidebar"><input class="search" id="search" placeholder="搜索 App" aria-label="搜索 App"><div class="list" id="app-list"></div></aside><section class="content"><div id="view-apps" class="panel"></div><div id="view-settings" class="panel settings hidden"></div></section></main><div class="notice" id="notice"></div><script src="./ui.js"></script></body></html>
