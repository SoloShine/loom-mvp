<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1e1f24; color: #e8e8ea;
        font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; border: 1px solid #3a3b42;
        border-radius: 8px; overflow: hidden; }
      #q { width: 100%; padding: 12px 14px; border: none; outline: none; background: transparent;
        color: inherit; font-size: 16px; border-bottom: 1px solid #3a3b42; }
      #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; height: calc(100% - 49px); }
      li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
      li.active { background: #2f6fdb; color: #fff; }
      li .title { flex: 0 0 auto; }
      li .meta { flex: 1; color: #9a9aa2; font-size: 12px; text-align: right;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li.active .meta { color: #cfe0ff; }
      li.unavailable { color: #e7a6aa; }
      li.unavailable .meta { color: #c99da0; }
      #launcher-error { display: block; color: #ffcdcf; background: #6b3037; white-space: normal; overflow-wrap: anywhere; }
      .hint { color: #6a6a72; font-size: 11px; padding: 4px 12px 8px; }
    </style>
  </head>
  <body>
    <input id="q" placeholder="搜索 App / 命令…" autofocus />
    <button id="manage" type="button">管理中心</button>
    <ul id="list"></ul>
    <div class="hint">↑↓ 选择 · Enter 执行 · Esc 关闭</div>
    <script src="./ui.js"></script>
  </body>
</html>
